<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundDrop — Soundboard</title>
  <link rel="icon" type="image/png" href="SoundDrop Favicon.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Full-viewport background layer -->
  <div class="page-bg" id="pageBg" aria-hidden="true"></div>

  <!-- Floating background customizer trigger (viewport-fixed, outside device) -->
  <button
    class="bg-toggle-btn"
    id="bgToggleBtn"
    type="button"
    aria-label="Customize background"
    aria-expanded="false"
    aria-controls="bgPanel"
  >
    <svg class="bg-toggle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2ZM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5Z"/>
    </svg>
  </button>

  <!-- Background customizer panel -->
  <div class="bg-panel-backdrop" id="bgPanelBackdrop" hidden></div>
  <aside
    class="bg-panel"
    id="bgPanel"
    role="dialog"
    aria-labelledby="bgPanelTitle"
    aria-modal="true"
    hidden
  >
    <header class="bg-panel-header">
      <h2 class="bg-panel-title" id="bgPanelTitle">Background</h2>
      <button class="bg-panel-close" id="bgPanelClose" type="button" aria-label="Close background panel">
        <span aria-hidden="true">&times;</span>
      </button>
    </header>

    <div class="bg-panel-body">
      <section class="bg-section">
        <h3 class="bg-section-label">Presets</h3>
        <div class="bg-preset-grid" id="bgPresetColors" role="group" aria-label="Preset solid colors"></div>
      </section>

      <section class="bg-section">
        <h3 class="bg-section-label">Gradients</h3>
        <div class="bg-preset-grid bg-preset-grid--gradients" id="bgPresetGradients" role="group" aria-label="Preset gradients"></div>
      </section>

      <section class="bg-section">
        <h3 class="bg-section-label">Custom color</h3>
        <label class="bg-color-picker-wrap">
          <input type="color" class="bg-color-picker" id="bgColorPicker" value="#0a0a0c" aria-label="Pick a custom background color">
          <span class="bg-color-picker-label">Pick a color</span>
        </label>
      </section>

      <section class="bg-section bg-section--photo">
        <h3 class="bg-section-label">Your photo</h3>
        <input type="file" class="bg-file-input" id="bgFileInput" accept="image/*" hidden>
        <button class="bg-action-btn bg-action-btn--primary" id="bgChoosePhotoBtn" type="button">
          Choose photo from device
        </button>
        <p class="bg-hint">Saved locally in your browser only. Max ~2 MB recommended.</p>
      </section>

      <button class="bg-action-btn bg-action-btn--reset" id="bgResetBtn" type="button">
        Reset to default
      </button>
    </div>
  </aside>

  <!-- Non-blocking toast for errors / info -->
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>

  <main class="page">
    <article class="device" aria-label="Soundboard remote control">
      <header class="device-header">
        <div class="share-wrapper">
          <button
            class="header-icon-btn share-toggle"
            id="shareToggle"
            type="button"
            aria-label="Share"
            aria-expanded="false"
            aria-controls="shareDropdown"
          >
            <svg class="share-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="6" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.75"/>
              <circle cx="18" cy="5.5" r="2.25" fill="none" stroke="currentColor" stroke-width="1.75"/>
              <circle cx="18" cy="18.5" r="2.25" fill="none" stroke="currentColor" stroke-width="1.75"/>
              <line x1="8.6" y1="10.6" x2="15.8" y2="6.8" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
              <line x1="8.6" y1="13.4" x2="15.8" y2="17.2" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
            </svg>
          </button>

          <nav class="share-dropdown" id="shareDropdown" aria-label="Share options" role="menu" hidden>
            <ul class="share-list" id="shareList"></ul>
          </nav>
        </div>

        <div class="device-brand">
          <span class="brand-dot"></span>
          <span class="brand-text">SFX REMOTE</span>
        </div>

        <div class="menu-wrapper">
          <button
            class="header-icon-btn menu-toggle"
            id="menuToggle"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="dropdownMenu"
          >
            <span class="menu-icon" aria-hidden="true">☰</span>
          </button>

          <nav class="dropdown-menu" id="dropdownMenu" aria-label="Site links" hidden>
            <ul class="menu-list">
              <li><a href="https://iamchrispaezjr.com" target="_blank" rel="noopener noreferrer">About Me</a></li>
              <li><a href="https://www.iamchrispaezjrstore.com" target="_blank" rel="noopener noreferrer">Store</a></li>
              <li><a href="https://iamchrispaezjrstore.com/supporters/pricing" target="_blank" rel="noopener noreferrer">Members</a></li>
              <li><a href="https://www.paypal.com/donate/?hosted_button_id=XRLVQFNNNTMAG" target="_blank" rel="noopener noreferrer">Donate</a></li>
              <li><a href="mailto:contactme@iamchrispaezjr.com">Contact Me</a></li>
            </ul>
          </nav>
        </div>
      </header>

      <section class="display-panel" aria-live="polite" aria-atomic="true">
        <div class="display-bezel">
          <div class="display-screen" id="displayScreen">
            <span class="display-emoji" id="displayEmoji" role="img" aria-label="Ready">🎛️</span>
            <span class="display-label" id="displayLabel">Ready</span>
          </div>
        </div>
      </section>

      <section class="keypad" id="keypad" aria-label="Sound effects"></section>

      <footer class="utility-bar">
        <button class="utility-btn" id="volumeBtn" type="button" aria-label="Toggle volume" aria-pressed="true">
          <span class="utility-icon" aria-hidden="true">🔊</span>
          <span class="utility-label">Volume</span>
        </button>
        <div class="volume-slider-wrap" id="volumeWrap">
          <input
            type="range"
            class="volume-slider"
            id="volumeSlider"
            min="0"
            max="100"
            value="80"
            aria-label="Volume level"
          >
        </div>
        <button class="utility-btn utility-btn--stop" id="stopBtn" type="button" aria-label="Stop all sounds">
          <span class="utility-icon" aria-hidden="true">⏹</span>
          <span class="utility-label">Stop All</span>
        </button>
      </footer>
    </article>
   </main>
