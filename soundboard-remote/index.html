<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SFX Remote — Soundboard</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Ambient background behind the device -->
  <div class="page-bg" aria-hidden="true"></div>

  <main class="page">
    <article class="device" aria-label="Soundboard remote control">
      <!-- Header: branding + hamburger menu -->
      <header class="device-header">
        <div class="device-brand">
          <span class="brand-dot"></span>
          <span class="brand-text">SFX REMOTE</span>
        </div>

        <div class="menu-wrapper">
          <button
            class="menu-toggle"
            id="menuToggle"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="dropdownMenu"
          >
            <span class="menu-icon" aria-hidden="true">☰</span>
          </button>

          <nav class="dropdown-menu" id="dropdownMenu" aria-label="Site links" hidden>
            <ul class="menu-list">
              <li><a href="https://iamchrispaezjr.com" target="_blank" rel="noopener noreferrer">About Me</a></li>
              <li><a href="https://iamchrispaezjrstudio.com" target="_blank" rel="noopener noreferrer">Studio</a></li>
              <li><a href="https://www.iamchrispaezjrstore.com" target="_blank" rel="noopener noreferrer">Store</a></li>
              <li><a href="https://iamchrispaezjr.com/shop/ca038637-896f-47e7-bf9d-da26055ed366" target="_blank" rel="noopener noreferrer">Members</a></li>
              <li><a href="https://www.paypal.com/donate/?hosted_button_id=XRLVQFNNNTMAG" target="_blank" rel="noopener noreferrer">Donate</a></li>
              <li><a href="mailto:contactme@iamchrispaezjr.com">Contact Me</a></li>
            </ul>
          </nav>
        </div>
      </header>

      <!-- LCD-style emoji display -->
      <section class="display-panel" aria-live="polite" aria-atomic="true">
        <div class="display-bezel">
          <div class="display-screen" id="displayScreen">
            <span class="display-emoji" id="displayEmoji" role="img" aria-label="Ready">🎛️</span>
            <span class="display-label" id="displayLabel">Ready</span>
          </div>
        </div>
      </section>

      <!-- Sound button keypad -->
      <section class="keypad" id="keypad" aria-label="Sound effects"></section>

      <!-- Utility controls -->
      <footer class="utility-bar">
        <button class="utility-btn" id="volumeBtn" type="button" aria-label="Toggle volume" aria-pressed="true">
          <span class="utility-icon" aria-hidden="true">🔊</span>
          <span class="utility-label">Volume</span>
        </button>
        <div class="volume-slider-wrap" id="volumeWrap">
          <input
            type="range"
            class="volume-slider"
            id="volumeSlider"
            min="0"
            max="100"
            value="80"
            aria-label="Volume level"
          >
        </div>
        <button class="utility-btn utility-btn--stop" id="stopBtn" type="button" aria-label="Stop all sounds">
          <span class="utility-icon" aria-hidden="true">⏹</span>
          <span class="utility-label">Stop All</span>
        </button>
      </footer>
    </article>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
